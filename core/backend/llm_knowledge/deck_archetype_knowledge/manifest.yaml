version: "0.3.0"
domain: "deck_aistack_smart_deck"
default_deck_type: "startup_pitch"
runtime_surface: "Smart Deck"
runtime_contract:
  renderer: "Svelte consumes backend render_schema_json through GeneratedSlideRenderer"
  llm_output: "JSON only; produce render_schema_json, critique, and missing-input notes"
  forbidden_output:
    - "Raw Svelte component code"
    - "Tailwind utility class strings"
    - "HTML fragments"
    - "External asset URLs not present in active deck context"
  required_runtime_inputs:
    - "active deck metadata"
    - "selected source slides"
    - "brand tokens"
    - "deck archetype context"
    - "visual language rules"
    - "hallucination constraints"
knowledge_modules:
  - id: "deck_types"
    path: "taxonomy/deck_types.yaml"
    retrieval_priority: "high"
  - id: "narrative_flows"
    path: "narrative/flows.yaml"
    retrieval_priority: "high"
  - id: "render_schema_rules"
    path: "visual_language/render_schema_rules.yaml"
    retrieval_priority: "high"
  - id: "writing_rules"
    path: "writing/copy_rules.yaml"
    retrieval_priority: "high"
  - id: "quality_rubrics"
    path: "rubrics/quality_rubrics.yaml"
    retrieval_priority: "high"
  - id: "hallucination_constraints"
    path: "constraints/hallucination_constraints.yaml"
    retrieval_priority: "high"
  - id: "retrieval_routing"
    path: "retrieval/routing_rules.yaml"
    retrieval_priority: "medium"
  - id: "deck_recipes"
    path: "deck_recipes/recipes.yaml"
    retrieval_priority: "high"
  - id: "diagnostics"
    path: "diagnostics/diagnostic_rules.yaml"
    retrieval_priority: "high"
  - id: "generation_contracts"
    path: "generation/slide_output_contracts.yaml"
    retrieval_priority: "high"
  - id: "examples"
    path: "examples/example_cases.yaml"
    retrieval_priority: "medium"
  - id: "eval_cases"
    path: "evals/eval_cases.yaml"
    retrieval_priority: "medium"
runtime_rules:
  always_retrieve:
    - "taxonomy/deck_types.yaml"
    - "visual_language/render_schema_rules.yaml"
    - "writing/copy_rules.yaml"
    - "constraints/hallucination_constraints.yaml"
    - "generation/slide_output_contracts.yaml"
  retrieve_by_deck_type: true
  retrieve_by_slide_archetype: true
  retrieve_deck_recipe: true
  retrieve_rubrics_before_critique: true
  retrieve_visual_rules_before_generation: true
