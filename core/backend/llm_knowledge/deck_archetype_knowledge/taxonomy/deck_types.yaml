deck_types:
  startup_pitch:
    name: "Startup investor pitch"
    purpose: "Create investor conviction in the company opportunity, evidence, team, and financing ask."
    common_audiences:
      - "angel_investor"
      - "seed_vc"
      - "series_a_vc"
      - "strategic_investor"
    canonical_flow:
      - "problem"
      - "why-now"
      - "regulatory-tailwinds"
      - "solution"
      - "product-demo"
      - "market-size"
      - "business-model"
      - "competition"
      - "blue-ocean-strategy"
      - "positioning"
      - "traction"
      - "lighthouse-customers"
      - "core-team"
      - "roadmap"
      - "ask"
      - "use-of-proceeds"
    quality_bar:
      - "Every slide advances one investor decision."
      - "Claims are backed by active deck facts or marked as missing evidence."
      - "Headlines read as arguments, not labels."
  vc_fund_pitch:
    name: "VC fund LP pitch"
    purpose: "Create LP conviction in the fund thesis, track record, portfolio construction, pipeline, team, and terms."
    common_audiences:
      - "limited_partner"
      - "family_office"
      - "fund_of_funds"
      - "institutional_allocator"
    canonical_flow:
      - "fund-thesis"
      - "why-now"
      - "regulatory-tailwinds"
      - "positioning"
      - "track-record"
      - "recent-exits"
      - "portfolio-construction"
      - "pipeline"
      - "core-team"
      - "extended-team"
      - "lp-terms"
      - "who-is-in"
      - "references"
    quality_bar:
      - "The LP can explain what the fund does differently after one pass."
      - "Track record and attribution are separated from aspiration."
      - "Terms and portfolio construction are explicit."
