name: Deck Extractor Stack

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  deck-extractor-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check extractor stack
        run: python scripts/check_deck_extractor_stack.py
