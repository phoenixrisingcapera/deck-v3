[package]
name = "flave"
version = "0.0.0"
description = "An agent-native document format and desktop publisher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "flave_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
