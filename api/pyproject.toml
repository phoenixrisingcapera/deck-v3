[project]
name = "deck-aistack-codes-backend"
version = "0.1.0"
description = "FastAPI backend for Deck AI Stack"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "alembic==1.13.2",
  "psycopg[binary]==3.2.3",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.9",
  "email-validator==2.2.0",
  "cryptography==43.0.1",
  "PyJWT==2.10.1",
  "PyMuPDF==1.24.10",
  "Pillow==12.3.0",
  "PyYAML==6.0.2",
  "boto3==1.34.162",
  "opentelemetry-api==1.27.0",
  "opentelemetry-sdk==1.27.0",
  "opentelemetry-exporter-otlp==1.27.0",
  "opentelemetry-instrumentation-fastapi==0.48b0",
  "pgvector==0.3.6",
  "sentence-transformers>=3.0.0,<4.0.0",
  "html5lib==1.1",
  "tinycss2==1.4.0",
  "playwright==1.54.0",
  "langchain==1.4.1",
  "langgraph==1.2.11",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
